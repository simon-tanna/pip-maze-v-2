<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/style.css">
    <link
      href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Pixelify+Sans:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://ajax.googleapis.com/ajax/libs/webfont/1.6.26/webfont.js"></script>
    <title>Pip's Temple Adventure</title>
    <style>
      body {
        background: #0e0a0c;
      }
      #app {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }
    </style>
</head>

<body>
    <div id="app">
        <div id="game-container"></div>
    </div>

    <div
      style="
        font-family: 'Black Ops One';
        position: absolute;
        visibility: hidden;
      "
    >
      Font Loader <span style="font-family: 'Pixelify Sans'">Font Loader</span>
    </div>

    <div id="dpad" class="pad" aria-label="Movement controls">
      <div></div>
      <button id="btn-up" class="pad-btn" style="grid-column: 2; grid-row: 1" aria-label="Up">▲</button>
      <div></div>
      <button id="btn-left" class="pad-btn" style="grid-column: 1; grid-row: 2" aria-label="Left">◄</button>
      <div></div>
      <button id="btn-right" class="pad-btn" style="grid-column: 3; grid-row: 2" aria-label="Right">►</button>
      <div></div>
      <button id="btn-down" class="pad-btn" style="grid-column: 2; grid-row: 3" aria-label="Down">▼</button>
      <div></div>
    </div>

    <div id="fire-container" class="fire">
      <button id="btn-fire" class="pad-btn fire-btn" aria-label="Fire">FIRE</button>
    </div>

    <script type="module" src="/src/main.ts"></script>
</body>
</html>
